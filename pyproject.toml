[project]
name = "kinopoisk2"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3,<4",
    "asyncpg>=0.29,<1",
    "beautifulsoup4>=4,<5",
    "click>=8.1,<9",
    "dishka>=1.6,<2",
    "greenlet>=3,<4",
    "psycopg2-binary>=2.9.11,<3",
    "pydantic>=2.13,<3",
    "python-dotenv>=1,<2",
    "requests>=2,<3",
    "sqlalchemy>=2,<3",
    "yandex-pgmigrate==1.0.13",
]

[tool.uv]
# pgmigrate requests the source distribution. Both distributions install the same psycopg2 module.
exclude-dependencies = ["psycopg2"]
