query SerialStructureSeason($contentId: String!,
  $limit: Int!,
  $offset: Int!,
  $withPreOrder: Boolean!,
  $withUserData: Boolean!) {
  seasonByContentId(contentId: $contentId) {
    id
    contentId
    number
    availabilityOptions @include(if: $withPreOrder) {
      ...PreOrderAvailabilityOptions
      __typename
    }
    episodes(limit: $limit, offset: $offset, source: ONLINE_WITH_ANNOUNCEMENTS) {
      total
      items {
        ...SerialStructureEpisode
        __typename
      }
      __typename
    }
    __typename
  }
}

fragment PreOrderOption on PreOrderOption {
  details {
    availabilityDate
    ... on PreOrderPurchasableDetails {
      price {
        amount
        currency {
          currencyCode
          symbol
          __typename
        }
        __typename
      }
      originalPrice {
        amount
        __typename
      }
      discount {
        percent
        __typename
      }
      purchaseItemId
      __typename
    }
    __typename
  }
  __typename
}

fragment EpisodeBase on Episode {
  id
  episodeContentId: contentId
  number
  __typename
}

fragment Title on Title {
  localized
  original
  __typename
}

fragment SeasonBase on Season {
  id
  contentId
  number
  __typename
}

fragment MoneyAmount on MoneyAmount {
  amount
  currency {
    currencyCode
    symbol
    __typename
  }
  __typename
}

fragment WatchPeriod on WatchPeriod {
  timeToExpire
  watchPeriodStatus
  __typename
}

fragment EpisodeMonetizationViewOption on ViewOption {
  watchabilityStatus
  purchasabilityStatus
  optionMonetizationModels
  availabilityAnnounce {
    availabilityDate
    type
    groupPeriodType
    announcePromise
    __typename
  }
  transactionalPrice {
    ...MoneyAmount
    __typename
  }
  transactionalMinimumPrice {
    ...MoneyAmount
    __typename
  }
  priceWithTotalDiscount {
    ...MoneyAmount
    __typename
  }
  watchPeriod {
    ...WatchPeriod
    __typename
  }
  __typename
}

fragment PreOrderAvailabilityOptions on AvailabilityOptions {
  options {
    ... on PreOrderOption {
      ...PreOrderOption
      __typename
    }
    __typename
  }
  __typename
}

fragment SerialStructureEpisode on Episode {
  ...EpisodeBase
  synopsis(override: OTT_WHEN_EXISTS)
  title {
    ...Title
    __typename
  }
  season {
    ...SeasonBase
    __typename
  }
  cover {
    avatarsUrl
    fallbackUrl
    __typename
  }
  ott {
    duration
    plannedAvailabilityDate
    timing @include(if: $withUserData) {
      current
      __typename
    }
    editorAnnotation
    __typename
  }
  viewOption {
    ...EpisodeMonetizationViewOption
    __typename
  }
  __typename
}
